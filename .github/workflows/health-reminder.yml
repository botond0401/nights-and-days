name: Health log reminder

# 8:15, 13:15, 20:15 CEST = 06:15, 11:15, 18:15 UTC. Drifts an hour earlier
# once CET (winter) kicks in — same caveat as the other reminder workflows.
on:
  schedule:
    - cron: "15 6 * * *"
    - cron: "15 11 * * *"
    - cron: "15 18 * * *"
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send reminder email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Health Tracker
          to: ${{ secrets.MAIL_USERNAME }}
          subject: "What's happened since last check-in?"
          body: "Log it here: https://botond0401.github.io/nights-and-days/health/log/"
