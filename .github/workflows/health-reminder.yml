name: Health log reminder

# 20:15 CEST = 18:15 UTC. Drifts an hour earlier once CET (winter) kicks in —
# same caveat as the other reminder workflows.
on:
  schedule:
    - cron: "15 18 * * *"
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send reminder email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Health Tracker
          to: ${{ secrets.MAIL_USERNAME }}
          subject: "Log today's food, stomach, toilet & skin"
          body: "Log it here: https://botond0401.github.io/nights-and-days/health/log/"
