name: Daily nights reminder

on:
  schedule:
    - cron: "0 17 * * *" # 17:00 UTC = 19:00 CEST. Cron is UTC-fixed, so this drifts to
                          # 18:00 CET in winter (DST ends) — tell me if you want it re-pinned then.
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send reminder email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Nights Tracker
          to: ${{ secrets.MAIL_USERNAME }}
          subject: "Where did you sleep tonight?"
          body: "Log tonight's night: https://botond0401.github.io/nights-and-days/log/"
