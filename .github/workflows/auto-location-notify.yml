name: Nights check-in

# Runs after the phone's daily location capture (23:00 local). 22:20 UTC is
# 23:20 in winter (CET) and 00:20 in summer (CEST) — after the capture either
# way; the script looks back over today and yesterday, so running past
# midnight (or GitHub's frequent hours-long delays) still finds it.
on:
  schedule:
    - cron: "20 22 * * *"
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check auto-captures and gaps
        id: check
        run: node scripts/check-auto-entry.js
        env:
          GIST_ID: "9286341881cfd023e7ec21b7a821471d"

      - name: Email the result
        if: steps.check.outputs.found == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Nights Tracker
          to: ${{ secrets.MAIL_USERNAME }}
          subject: "Nights tracker update"
          body: ${{ steps.check.outputs.message }}
