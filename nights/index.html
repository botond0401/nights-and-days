<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nights</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <p class="back"><a href="../">← Home</a></p>
  <h1>Where I slept</h1>
  <p class="subtitle">Tracking nights since Jan 1, 2024.</p>

  <div class="controls">
    <div class="tabs" id="scope-tabs">
      <button class="tab active" data-scope="year">By year</button>
      <button class="tab" data-scope="lifetime">Lifetime</button>
    </div>
    <select id="year-select" class="btn"></select>
  </div>

  <div id="status" class="status"></div>

  <section id="summary" class="card summary"></section>

  <section id="heatmap-section" class="card">
    <div id="heatmap"></div>
    <div id="legend" class="legend"></div>
  </section>

  <section class="tables">
    <div class="card">
      <h2>Countries by nights</h2>
      <table id="countries-table"><tbody></tbody></table>
    </div>
    <div class="card">
      <h2>Towns by nights</h2>
      <table id="towns-table"><tbody></tbody></table>
    </div>
  </section>
</div>

<div id="tooltip" class="tooltip" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
